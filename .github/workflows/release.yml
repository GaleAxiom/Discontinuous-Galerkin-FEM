name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        # Generate changelog
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
        fi
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: Release ${{ steps.version.outputs.version }}
        body: |
          ## Changes in this Release
          
          ${{ steps.changelog.outputs.changelog }}
          
          ## Docker Image
          
          ```bash
          docker pull ghcr.io/galeaxiom/discontinuous-galerkin-fem:${{ steps.version.outputs.version }}
          ```
          
          ## Installation
          
          See [README.md](https://github.com/GaleAxiom/Discontinuous-Galerkin-FEM#readme) for installation instructions.
        draft: false
        prerelease: false

  build-release:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/galeaxiom/discontinuous-galerkin-fem:latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S dgfem -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure

    - name: Package artifacts
      run: |
        mkdir -p release-artifacts
        cp build/libdgfem.a release-artifacts/
        cp -r dgfem/include release-artifacts/
        cp README.md release-artifacts/
        cp CODE_STYLE.md release-artifacts/
        cp DOCKER.md release-artifacts/
        tar -czf dgfem-release.tar.gz release-artifacts/

    - name: Upload Release Asset
      uses: actions/upload-artifact@v4
      with:
        name: dgfem-release
        path: dgfem-release.tar.gz
