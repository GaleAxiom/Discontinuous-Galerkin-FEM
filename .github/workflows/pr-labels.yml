name: PR Labeling

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label-size:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate PR size and add label
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          
          // Get PR files
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
          });
          
          // Calculate total changes
          const totalChanges = files.reduce((sum, file) => 
            sum + file.additions + file.deletions, 0);
          
          // Determine size label
          let sizeLabel;
          if (totalChanges < 10) {
            sizeLabel = 'size/XS';
          } else if (totalChanges < 50) {
            sizeLabel = 'size/S';
          } else if (totalChanges < 200) {
            sizeLabel = 'size/M';
          } else if (totalChanges < 500) {
            sizeLabel = 'size/L';
          } else {
            sizeLabel = 'size/XL';
          }
          
          // Remove old size labels
          const currentLabels = pr.labels.map(label => label.name);
          const sizeLabels = currentLabels.filter(label => label.startsWith('size/'));
          
          for (const label of sizeLabels) {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              name: label,
            });
          }
          
          // Add new size label
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            labels: [sizeLabel],
          });
          
          console.log(`Added label: ${sizeLabel} (${totalChanges} changes)`);

  label-type:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Auto-label by changed files
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          
          // Get PR files
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
          });
          
          const labels = new Set();
          
          // Analyze file paths to determine labels
          for (const file of files) {
            if (file.filename.includes('test')) {
              labels.add('tests');
            }
            if (file.filename.includes('example')) {
              labels.add('examples');
            }
            if (file.filename.match(/\.(md|txt)$/i)) {
              labels.add('documentation');
            }
            if (file.filename.includes('Dockerfile') || file.filename.includes('docker')) {
              labels.add('docker');
            }
            if (file.filename.includes('.github/workflows')) {
              labels.add('ci/cd');
            }
            if (file.filename.match(/\.(cpp|hpp)$/i)) {
              labels.add('code');
            }
          }
          
          // Add labels
          if (labels.size > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: Array.from(labels),
            });
            
            console.log(`Added labels: ${Array.from(labels).join(', ')}`);
          }
