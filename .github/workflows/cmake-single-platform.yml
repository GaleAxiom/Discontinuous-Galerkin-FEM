name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/galeaxiom/discontinuous-galerkin-fem:latest

    steps:
    - uses: actions/checkout@v4

    # Cache CMake build directory
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.ccache
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', 'dgfem/**/*.cpp', 'dgfem/**/*.hpp') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    # - name: Install dependencies
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y gmsh libgmsh-dev libeigen3-dev libgtest-dev libgmock-dev
    #     # Build and install Google Test
    #     cd /tmp
    #     sudo cmake /usr/src/googletest
    #     sudo make
    #     sudo cp lib/*.a /usr/lib/ 2>/dev/null || sudo cp ./*.a /usr/lib/ 2>/dev/null || sudo find . -name "*.a" -exec cp {} /usr/lib/ \;

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory
      run: cmake -B build -S dgfem -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)

    - name: Test
      working-directory: build
      run: ctest --output-on-failure

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-debug
        path: build/Testing/Temporary/
        retention-days: 7
